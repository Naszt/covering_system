<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>矩形覆盖 · Covering System</title>
  <!-- 外部CSS文件 -->
  <link rel="stylesheet" href="square/style.css?v=20260828f">
  <style>
    /* 选关页面样式 */
    #level-select-page {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    #level-select-page .level-select-container {
      text-align: center;
      background: #fff;
      padding: 40px;
      border: 1px solid #111;
      max-width: 400px;
      width: 90%;
    }
    #level-select-page .level-select-container h1 {
      color: #111;
      margin-top: 0;
      margin-bottom: 30px;
      font-size: 2rem;
    }
    #level-select-page .level-buttons-vertical {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 30px;
    }
    #level-select-page .level-btn {
      background: #fff;
      border: 1px solid #315f7d;
      color: #315f7d;
      padding: 20px;
      border-radius: 0;
      font-size: 1.5rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: block;
      text-align: center;
    }
    #level-select-page .level-btn:hover {
      color: #fff;
      background: #315f7d;
    }
    #level-select-page .level-btn:active {
      transform: translateY(1px);
    }
    #level-select-page .level-btn.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: #eee;
    }
    #level-select-page .level-btn.active {
      color: #fff;
      background: #315f7d;
    }
    #level-select-page .back-link {
      display: inline-block;
      color: #111;
      text-decoration: none;
      font-size: 1rem;
    }
    #level-select-page .back-link:hover {
      text-decoration: underline;
    }
  </style>
  <!-- 页面内注释：该应用用于可视化覆盖系统，支持动态调整底数a和b，添加/删除/移动矩形，计算覆盖率 -->
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">Covering System</a>
    <nav aria-label="可视化项目">
      <a href="tree.html">树形覆盖</a>
      <a class="active" href="game.html?level=free" aria-current="page">矩形覆盖</a>
    </nav>
  </header>

  <div id="level-select-page" style="display: none;">
    <div class="level-select-container">
      <h1>世界1</h1>
      <div class="level-buttons-vertical">
        <a href="game.html?level=1-1" class="level-btn" data-level="1-1">1-1</a>
        <a href="game.html?level=1-2" class="level-btn" data-level="1-2">1-2</a>
        <a href="game.html?level=1-3" class="level-btn" data-level="1-3">1-3</a>
        <a href="game.html?level=1-4" class="level-btn" data-level="1-4">1-4</a>
      </div>
      <a href="index.html" class="back-link">返回首页</a>
    </div>
  </div>

  <div class="main">
    <!-- 左侧：画布区域 -->
    <div class="canvas-area">
      <div class="info">
        <span id="coverage" class="coverage">覆盖率: 0.00%</span>
        <span class="count">元素个数: <span id="count">0</span></span>
      </div>
      <div class="holder">
        <div class="scrollbar-container">
          <!-- 主画布：用于显示矩形和网格 -->
          <canvas id="canvas" width="500" height="500"></canvas>
          
          <!-- 水平滚动条 -->
          <div class="scrollbar-horizontal">
            <div class="scrollbar-track-horizontal">
              <div class="scrollbar-thumb-horizontal"></div>
            </div>
          </div>
          
          <!-- 垂直滚动条 -->
          <div class="scrollbar-vertical">
            <div class="scrollbar-track-vertical">
              <div class="scrollbar-thumb-vertical"></div>
            </div>
          </div>
          
          <!-- Y轴标签 -->
          <div id="y-axis-labels" class="axis-labels y-axis"></div>
          
          <!-- X轴标签 -->
          <div id="x-axis-labels" class="axis-labels x-axis"></div>
        </div>
      </div>
    </div>
    
    <!-- 右侧：矩阵面板和控制区域 -->
    <div class="matrix">
      <!-- 返回链接 -->
      <div class="workspace-nav">
        <a href="game.html?world=1">世界 1</a>
        <a href="tree.html">树形覆盖</a>
        <a href="index.html">首页</a>
      </div>
      
      <!-- 参数面板：用于设置底数a和b -->
      <div class="param-panel">
        <label>a =</label>
        <input type="number" id="paramA" min="2" max="10" value="2" step="1">
        <label>b =</label>
        <input type="number" id="paramB" min="2" max="10" value="3" step="1">
        <button class="act" id="applyParams">应用</button>
      </div>
      
      <!-- 矩阵控制：调整网格大小 -->
      <div class="matrix-controls">
        <button class="act" id="grid-decrease" title="缩小网格">-</button>
        <div class="grid-size-label">大小 <span id="grid-size">9×9</span></div>
        <button class="act" id="grid-increase" title="扩大网格">+</button>
      </div>
      
      <!-- 矩阵画布：显示矩形类型和计数 -->
      <div class="matrix-canvas-wrapper">
        <canvas id="matrixCanvas"></canvas>
        <div id="matrix-y-axis-labels" class="axis-labels y-axis"></div>
        <div id="matrix-x-axis-labels" class="axis-labels x-axis"></div>
      </div>
      
      <!-- 文本区域：显示和编辑矩形编码 -->
      <div class="textarea-wrap">
        <textarea id="rect-textarea" placeholder="输入树形覆盖算式，或坐标编码 (xrev+a^n)(yrev+b^m)"></textarea>
        <div class="expression-tools">
          <span id="rect-parse-message" role="status" aria-live="polite">支持与树形覆盖相同的前缀表达式。</span>
          <label>递归展开 <input id="prefix-recursion-depth" type="number" min="1" max="20" value="6"></label>
        </div>
      </div>
      
      <!-- 操作按钮 -->
      <div class="acts">
        <div class="action-row">
          <button class="act" id="clear">Clear</button>
          <button class="act" id="del">[D]elete</button>
        </div>
        <div class="action-row">
          <button class="act" id="usage">使用说明</button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- 外部JavaScript文件（按功能模块拆分） -->
  <!--
    模块文件功能说明：
    square/core.js    - 全局变量、DOM引用、辅助函数（坐标转换、颜色计算）
    square/levels.js   - 关卡数据定义、状态管理和进度存储
    square/encoding.js  - 矩形编码/解码、序列化/反序列化
    square/drawing.js   - 精细网格绘制、坐标轴标签、矩形渲染、主绘制循环
    square/matrix.js   - 右侧9×9矩阵网格绘制和点击处理
    square/coverage.js  - 覆盖率计算（扫描线算法）
    square/rectangles.js - 矩形的增删改查、移动、删除、清空
    square/history.js   - 文本区域历史记录、撤销/重做、防抖解析
    square/params.js   - 参数管理（底数a和b）、重新初始化
    square/events.js   - 鼠标、键盘、滚动条等事件处理
    square/init.js    - 应用程序初始化、DOMContentLoaded入口
  -->
  <script src="tree/cpp-parser.js?v=20260828c"></script>
  <script src="square/prefix.js?v=20260828g"></script>
  <script src="square/core.js?v=20260828f"></script>
  <script src="square/levels.js?v=20260828f"></script>
  <script src="square/encoding.js?v=20260828f"></script>
  <script src="square/drawing.js?v=20260828f"></script>
  <script src="square/matrix.js?v=20260828f"></script>
  <script src="square/coverage.js?v=20260828f"></script>
  <script src="square/history.js?v=20260828g"></script>
  <script src="square/rectangles.js?v=20260828f"></script>
  <script src="square/params.js?v=20260828f"></script>
  <script src="square/events.js?v=20260828f"></script>
  <script src="square/init.js?v=20260828g"></script>
  
  <!-- 页面内注释：应用功能包括：
     1. 支持底数a和b的动态调整（2-10）
     2. 点击矩阵选择矩形类型
     3. 在画布上点击添加矩形，拖拽移动矩形
     4. 支持缩放和平移视图
     5. 实时计算和显示覆盖率
     6. 支持矩形编码的文本编辑和解析
     7. 支持撤销/重做操作
     8. 支持键盘快捷键（D删除，Ctrl+Z撤销，Ctrl+Y重做）
  -->
</body>
</html>
