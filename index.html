<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="覆盖系统的两个交互式视图：树形覆盖与矩形覆盖。">
  <title>Covering System · 可视化项目</title>
  <style>
    :root {
      --paper: #fff;
      --ink: #111;
      --muted: #666;
      --line: #d8d8d8;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main { width: min(920px, 100%); }
    .kicker {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.25rem, 7vw, 4.6rem);
      font-weight: 500;
      letter-spacing: -.045em;
    }
    .intro {
      max-width: 620px;
      margin: 14px 0 34px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.65;
    }
    .projects {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    article {
      min-height: 280px;
      display: flex;
      flex-direction: column;
      padding: 26px;
      border: 1px solid var(--line);
      background: #fff;
    }
    .project-index {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid var(--ink);
      color: var(--ink);
      background: #fff;
      font-family: Georgia, serif;
      font-size: 1.15rem;
    }
    h2 {
      margin: 22px 0 8px;
      font-family: Georgia, "Songti SC", serif;
      font-size: 1.45rem;
      font-weight: 600;
    }
    article p {
      margin: 0;
      color: var(--muted);
      font-size: .87rem;
      line-height: 1.6;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
      padding-top: 24px;
    }
    .button {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      padding: 9px 14px;
      border: 1px solid var(--line);
      color: var(--ink);
      background: #fff;
      text-decoration: none;
      font-size: .8rem;
      font-weight: 750;
    }
    .button.primary {
      border-color: var(--ink);
      color: #fff;
      background: var(--ink);
    }
    .button:hover { border-color: var(--ink); }
    .button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    @media (max-width: 680px) {
      body { padding: 20px 14px; place-items: start center; }
      .projects { grid-template-columns: 1fr; }
      article { min-height: 245px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Interactive mathematics</p>
    <h1>Covering System</h1>
    <p class="intro">两个并列的实验空间，从几何长方形与满叉树两种视角探索剩余类、模数互异和完整覆盖。</p>

    <section class="projects" aria-label="可视化项目">
      <article>
        <span class="project-index" aria-hidden="true">T</span>
        <h2>树形覆盖</h2>
        <p>输入文章中的树算式，以黑白叶子、无标记分叉和水平加法线直接观察它的递归结构。</p>
        <div class="actions">
          <a class="button primary" href="tree.html">进入实验室</a>
        </div>
      </article>

      <article>
        <span class="project-index" aria-hidden="true">R</span>
        <h2>矩形覆盖</h2>
        <p>在二维乘积空间中放置、移动与编辑剩余类矩形，观察覆盖率并完成已有的关卡。</p>
        <div class="actions">
          <a class="button primary" href="game.html?level=free">自由探索</a>
          <a class="button" href="game.html?world=1">世界 1</a>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
