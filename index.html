<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>入口 - 覆盖系统</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Segoe UI, Roboto, sans-serif;
      margin: 0;
      padding: 8px;
    }
    .container {
      background: #ffffff;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }
    h1 {
      color: #333;
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 2rem;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 1rem;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 30px;
    }
    .btn {
      background: #8800ff;
      border: 0;
      color: #fff;
      padding: 16px 24px;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: 300;
      cursor: pointer;
      transition: background-color 0.2s;
      text-decoration: none;
      display: block;
    }
    .btn:hover {
      background: #8800ff88;
    }
    .btn:active {
      transform: translateY(1px);
    }
    .btn-explore {
      background: #8800ff;
    }
    .btn-explore:hover {
      background: #8800ff88;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>「Covering System」</h1>
    <div class="buttons">
      <a href="game.html?level=free" class="btn btn-explore">sandbox</a>
      <a href="game.html?world=1" class="btn">world-1</a>
    </div>
  </div>
</body>
</html>
